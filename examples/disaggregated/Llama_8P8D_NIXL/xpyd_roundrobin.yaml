# Loopback placeholders only. Prefill entries are prefill backend hosts;
# decode entries are decode backend hosts. No proxy host is required for NIXL.
model: /workspace/Meta-Llama-3-8B-Instruct/
prefill:
  - 127.0.0.1:8100
  - 127.0.0.1:8101
  - 127.0.0.1:8102
  - 127.0.0.1:8103
  - 127.0.0.1:8104
  - 127.0.0.1:8105
  - 127.0.0.1:8106
  - 127.0.0.1:8107
decode:
  - 127.0.0.1:8200
  - 127.0.0.1:8201
  - 127.0.0.1:8202
  - 127.0.0.1:8203
  - 127.0.0.1:8204
  - 127.0.0.1:8205
  - 127.0.0.1:8206
  - 127.0.0.1:8207
port: 8868
log_level: info
scheduling: roundrobin
disaggregated_mode: nixl
first_token_source: decode
startup:
  wait_timeout_seconds: 1200
  probe_interval_seconds: 2

health_check:
  enabled: true
  interval_seconds: 2
  timeout_seconds: 2
