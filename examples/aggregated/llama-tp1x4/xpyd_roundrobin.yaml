# All addresses are loopback placeholders: aggregated entries are backend hosts; xPyD listens on port 8868.
model: "/workspace/Meta-Llama-3-8B-Instruct/"
scheduling: roundrobin

models:
  - name: "/workspace/Meta-Llama-3-8B-Instruct/"
    aggregated:
      - "127.0.0.1:8000"
      - "127.0.0.1:8001"
      - "127.0.0.1:8002"
      - "127.0.0.1:8003"
    scheduler: roundrobin

port: 8868
log_level: info

startup:
  wait_timeout_seconds: 1200
  probe_interval_seconds: 2

health_check:
  enabled: true
  interval_seconds: 2
  timeout_seconds: 2
