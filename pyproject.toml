[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpyd-proxy"
version = "1.7.0"
description = "Lightweight Prefill-Decode proxy for disaggregated LLM serving"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "uvloop>=0.19.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "colorlog>=6.8.0",
    "transformers>=4.38.0",
    "prometheus-client>=0.20.0",
    "PyYAML>=6.0",
    "msgspec>=0.18.0",
    "pyzmq>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "isort>=5.13.0",
    "tiktoken>=0.7.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    "black==26.5.1",
]

[project.scripts]
xpyd = "xpyd.proxy:main"

[tool.setuptools.packages.find]
include = ["xpyd*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "benchmark: end-to-end benchmark tests (high concurrency, large clusters)",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.bandit]
exclude_dirs = ["tests", "benchmarks", "examples", "bot"]
# B101: asserts guard internal invariants, not untrusted input.
# B104: binding 0.0.0.0 is the documented default listen address.
# B105/B107: "token" appears in first-token routing names, not in credentials.
# B311: scheduling uses random for load spreading, not for secrets.
# B615: the tokenizer source is operator-supplied, so a pinned revision
# cannot be hardcoded here.
skips = ["B101", "B104", "B105", "B107", "B311", "B615"]

[tool.isort]
profile = "black"
line_length = 88
