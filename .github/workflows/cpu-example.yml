name: CPU example

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: cpu-example-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregated:
    name: Aggregated OPT-125M
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            /tmp/tokenizers/facebook/opt-125m
          key: cpu-vllm-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('pyproject.toml', 'examples/aggregated/opt-125m-cpu/install_vllm_cpu.sh', 'examples/aggregated/opt-125m-cpu/download_model.sh') }}
      - name: Install xPyD and vLLM CPU
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .
          PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}" \
            bash examples/aggregated/opt-125m-cpu/install_vllm_cpu.sh
      - name: Download OPT-125M
        run: bash examples/aggregated/opt-125m-cpu/download_model.sh
      - name: Run aggregated CPU lifecycle test
        run: |
          export PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          bash examples/aggregated/opt-125m-cpu/run_all.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: aggregated-opt-125m-cpu-logs
          path: examples/aggregated/opt-125m-cpu/logs/

  disaggregated-1p1d:
    name: Disaggregated OPT-125M 1P1D NIXL TCP
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            /tmp/tokenizers/facebook/opt-125m
          key: cpu-vllm-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('pyproject.toml', 'examples/aggregated/opt-125m-cpu/install_vllm_cpu.sh', 'examples/aggregated/opt-125m-cpu/download_model.sh') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/xpyd-nixl-wheels
          key: cpu-nixl-${{ runner.os }}-${{ runner.arch }}-ubuntu2204-py312-${{ hashFiles('examples/disaggregated/opt-125m-cpu-nixl/install_nixl_cpu.sh', 'examples/disaggregated/opt-125m-cpu-nixl/wheel_cache.py') }}
      - name: Install xPyD and vLLM CPU
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .
          PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}" \
            bash examples/aggregated/opt-125m-cpu/install_vllm_cpu.sh
      - name: Build CPU NIXL with UCX
        run: |
          export PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          bash examples/disaggregated/opt-125m-cpu-nixl/install_nixl_cpu.sh
      - name: Download OPT-125M
        run: bash examples/aggregated/opt-125m-cpu/download_model.sh
      - name: Run 1P1D disaggregated CPU lifecycle test
        run: |
          export PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          bash examples/disaggregated/opt-125m-cpu-nixl/run_all.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: disaggregated-opt-125m-cpu-nixl-1p1d-logs
          path: examples/disaggregated/opt-125m-cpu-nixl/logs/

  disaggregated-multi:
    name: Disaggregated OPT-125M ${{ matrix.topology }} NIXL TCP
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - topology: 2P1D
            config: xpyd_2p1d.yaml
            prefill-count: 2
            decode-count: 1
          - topology: 1P2D
            config: xpyd_1p2d.yaml
            prefill-count: 1
            decode-count: 2
          - topology: 2P2D
            config: xpyd_2p2d.yaml
            prefill-count: 2
            decode-count: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            /tmp/tokenizers/facebook/opt-125m
          key: cpu-vllm-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('pyproject.toml', 'examples/aggregated/opt-125m-cpu/install_vllm_cpu.sh', 'examples/aggregated/opt-125m-cpu/download_model.sh') }}
      - uses: actions/cache@v6
        with:
          path: ~/.cache/xpyd-nixl-wheels
          key: cpu-nixl-${{ runner.os }}-${{ runner.arch }}-ubuntu2204-py312-${{ hashFiles('examples/disaggregated/opt-125m-cpu-nixl/install_nixl_cpu.sh', 'examples/disaggregated/opt-125m-cpu-nixl/wheel_cache.py') }}
      - name: Install xPyD and vLLM CPU
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .
          PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}" \
            bash examples/aggregated/opt-125m-cpu/install_vllm_cpu.sh
      - name: Build CPU NIXL with UCX
        run: |
          export PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          bash examples/disaggregated/opt-125m-cpu-nixl/install_nixl_cpu.sh
      - name: Download OPT-125M
        run: bash examples/aggregated/opt-125m-cpu/download_model.sh
      - name: Run ${{ matrix.topology }} disaggregated CPU lifecycle test
        run: |
          export PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          bash examples/disaggregated/opt-125m-cpu-nixl/run_topology.sh \
            "${{ matrix.config }}" \
            "${{ matrix.prefill-count }}" \
            "${{ matrix.decode-count }}"
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: disaggregated-opt-125m-cpu-nixl-${{ matrix.topology }}-logs
          path: examples/disaggregated/opt-125m-cpu-nixl/logs/
