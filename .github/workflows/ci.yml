name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: >-
          python -m pytest tests/unit/ -v --tb=short --timeout=120
          --cov=xpyd --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      # Pinned to the revisions in .pre-commit-config.yaml so the two gates
      # cannot disagree; bump both together.
      - run: pip install -e ".[dev]" ruff isort==5.13.2 black==26.10.1
      - run: ruff check .
      - run: isort --check-only --diff .
      - run: black --check --diff xpyd
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install build && python -m build
      - run: pip install dist/*.whl
      - run: xpyd --help && xpyd --version
      - name: Smoke test config CLI
        run: |
          set -euxo pipefail
          tmpdir="$(mktemp -d)"

          printf 'n\n' | xpyd --init-config "$tmpdir/generated.yaml"
          xpyd --validate-config "$tmpdir/generated.yaml"

          xpyd --init-config "$tmpdir/interactive.yaml" <<'EOF'
          y
          aggregated
          ci-model
          1
          same
          8100
          127.0.0.1

          8000
          warning
          loadbalanced
          y
          EOF
          xpyd --validate-config "$tmpdir/interactive.yaml"

          mkdir "$tmpdir/auto"
          (cd "$tmpdir/auto" && printf 'n\n' | xpyd)
          xpyd proxy --validate-config "$tmpdir/auto/xpyd.yaml"

          cat > "$tmpdir/fixable.yaml" <<'YAML'
          model: demo
          decode:
            - 127.0.0.1
          scheduling: round_robbin
          YAML

          if xpyd --validate-config "$tmpdir/fixable.yaml"; then
            echo "Expected invalid config to fail validation" >&2
            exit 1
          fi

          xpyd fix-config "$tmpdir/fixable.yaml" --write
          xpyd --validate-config "$tmpdir/fixable.yaml"
          xpyd proxy fix-config "$tmpdir/fixable.yaml"
          test "$(find "$tmpdir" -name '*.bak' -type f | wc -l)" -eq 1
      - name: Validate example configurations
        run: bash tests/validate_example_configs.sh
